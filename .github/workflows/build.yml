name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: |
          chmod +x gradlew
          mkdir -p libs
          curl -sSL -o "libs/touhoulittlemaid-1.5.3-forge+mc1.20.1.jar" "https://cdn.modrinth.com/data/R0bDWFAW/versions/g1SKoGQJ/touhoulittlemaid-1.5.3-forge%2Bmc1.20.1.jar"
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tlm_tell_maids
          path: build/libs/*.jar
          if-no-files-found: error
